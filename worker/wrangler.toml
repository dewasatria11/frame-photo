name = "lensflow-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "lensflow"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "lensflow-assets"

# Configure with: wrangler secret put ALLOWED_ORIGINS
# Example value: https://watermark.example.com,http://localhost:3000
